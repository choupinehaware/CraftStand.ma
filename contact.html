      'contact.form.project.other': 'أخرى',
      'contact.form.message': 'تفاصيل المشروع', 'contact.form.submit': 'إرسال الطلب',
      'contact.info.address.title': 'المقر الرئيسي', 'contact.info.address.value': 'الرباط، المغرب',
      'contact.info.phone.title': 'الهاتف',
      'contact.info.whatsapp.title': 'واتساب',
      'contact.info.whatsapp.value': 'رد فوري خلال ساعات العمل',
      'contact.info.whatsapp.btn': 'تحدث عبر واتساب',
      'contact.info.hours.title': 'ساعات العمل',
      'contact.info.hours.value': 'السبت - الاثنين: 9:00 - 18:00',
      // Travel
      'contact.travel.title': 'استشارة مجانية بمقر الرباط',
      'contact.travel.desc': 'الاستشارة الشخصية في مقرنا بالرباط مجانية تماماً. للزيارات خارج الرباط (الدار البيضاء، مراكش، فاس، إلخ)، تُطبق رسوم السفر وستُبلغ قبل الجدولة.',
      'footer.rights': 'جميع الحقوق محفوظة.',
    }
  };

  let currentLang = 'en';

  function setLang(lang) {
    currentLang = lang;
    const isRTL = lang === 'ar';
    document.documentElement.lang = lang;
    document.documentElement.dir = isRTL ? 'rtl' : 'ltr';
    document.body.dir = isRTL ? 'rtl' : 'ltr';
    document.body.className = isRTL ? 'font-cairo' : 'font-inter';

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (translations[lang] && translations[lang][key]) {
        el.innerHTML = translations[lang][key];
      }
    });

    document.querySelectorAll('.lang-btn').forEach(btn => {
      if (btn.dataset.lang === lang) {
        btn.classList.add('bg-gold', 'text-dark');
        btn.classList.remove('text-slate-400', 'hover:text-gold');
      } else {
        btn.classList.remove('bg-gold', 'text-dark');
        btn.classList.add('text-slate-400', 'hover:text-gold');
      }
    });
  }

  function toggleMobileNav() {
    document.getElementById('mobileNav').classList.toggle('hidden');
  }

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
  }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
  document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));

  document.getElementById('contactForm').addEventListener('submit', function(e) {
    e.preventDefault();
    showToast(currentLang === 'ar' ? 'تم إرسال طلبك بنجاح!' : currentLang === 'fr' ? 'Votre demande a été envoyée !' : 'Your request has been sent!');
    this.reset();
  });

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  setLang('en');
  </script>
</body>
