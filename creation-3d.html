  let currentLang = 'fr';

  function setLang(lang) {
    currentLang = lang;
    const isRTL = lang === 'ar';
    document.documentElement.lang = lang;
    document.documentElement.dir = isRTL ? 'rtl' : 'ltr';
    document.body.dir = isRTL ? 'rtl' : 'ltr';
    document.body.className = isRTL ? 'font-cairo' : 'font-inter';

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (translations[lang] && translations[lang][key]) {
        el.innerHTML = translations[lang][key];
      }
    });

    document.querySelectorAll('.lang-btn').forEach(btn => {
      if (btn.dataset.lang === lang) {
        btn.classList.add('bg-gold', 'text-dark');
        btn.classList.remove('text-slate-400', 'hover:text-gold');
      } else {
        btn.classList.remove('bg-gold', 'text-dark');
        btn.classList.add('text-slate-400', 'hover:text-gold');
      }
    });
  }

  // ===== MOBILE NAV =====
  function toggleMobileNav() {
    document.getElementById('mobileNav').classList.toggle('hidden');
  }

  // ===== FAQ ACCORDION =====
  function toggleFaq(btn) {
    const answer = btn.nextElementSibling;
    const chevron = btn.querySelector('.faq-chevron');
    const isOpen = answer.classList.contains('open');

    // Close all other FAQs
    document.querySelectorAll('.faq-answer').forEach(a => a.classList.remove('open'));
    document.querySelectorAll('.faq-chevron').forEach(c => c.classList.remove('open'));

    // Toggle current
    if (!isOpen) {
      answer.classList.add('open');
      chevron.classList.add('open');
    }
  }

  // ===== SCROLL ANIMATIONS =====
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
  }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
  document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));

  // ===== TOAST =====
  function showToast(msg) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ===== INIT =====
  setLang('fr');
  </script>
